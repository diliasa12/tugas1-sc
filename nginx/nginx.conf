worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # --- rate limit: 5 request/detik per IP klien ---
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
  limit_req_status 429;

  # --- gzip untuk JSON ---
  gzip on;
  gzip_types application/json;
  gzip_min_length 100;
  gzip_proxied any;
  gzip_vary on;

  # --- load balancing: 'api' di-resolve Docker DNS ke 3 IP replica ---
  upstream backend {
    zone backend_zone 64k;
    server api:3000;
  }

  server {
    listen 80;

    location /api/ {
      limit_req zone=api_limit burst=10 nodelay;

      # /api/notes -> http://backend/notes
      proxy_pass http://backend/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # bukti load balancing
      add_header X-Upstream $upstream_addr always;

      # header keamanan (add_header tidak diwariskan jika location punya add_header sendiri,
      # jadi semuanya ditulis di sini)
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "no-referrer" always;
    }

    location / {
      return 404;
    }
  }
}